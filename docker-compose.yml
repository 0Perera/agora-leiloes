name: agora

# Portas do host configuráveis (DB_PORT, API_PORT, WEB_PORT) caso alguma já esteja em uso.
services:
  db:
    image: postgres:17
    container_name: agora-postgres
    environment:
      POSTGRES_USER: agora
      POSTGRES_PASSWORD: agora
      POSTGRES_DB: agora
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agora -d agora"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://agora:agora@db:5432/agora
      DB_SSL: "false"
      WEB_ORIGIN: http://localhost:${WEB_PORT:-5173}
      PORT: "3000"
      # Só para desenvolvimento local; no Render o valor é gerado.
      JWT_SECRET: dev-only-jwt-secret-change-me-0123456789
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        # O navegador chama a API pela porta publicada no host.
        VITE_API_URL: http://localhost:${API_PORT:-3000}
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - api

volumes:
  db-data:
