name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run lint:check
      - run: npm test
      - run: npm run build
      # O segundo build reaproveita o cache incremental do tsc: se o cache ficar fora da dist, nada é emitido.
      - name: Build repetido gera dist/main.js
        run: npm run build && test -f dist/main.js

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint:check
      - run: npm run build

  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: README com no máximo 300 linhas
        run: test $(wc -l < README.md) -le 300
