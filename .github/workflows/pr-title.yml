name: PR title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            test
            docs
            chore
            ci
            perf
          scopes: |
            auth
            users
            wallets
            catalog
            lots
            bids
            settlement
            audit
            receipts
            web
            db
            infra
          requireScope: true
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            A descrição "{subject}" do título "{title}" deve começar com letra minúscula.
