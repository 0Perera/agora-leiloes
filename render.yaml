# Blueprint do Render: API, front e banco, todos no plano free (D-027, D-034).
# WEB_ORIGIN e VITE_API_URL são pedidos na criação do Blueprint (sync: false),
# porque as URLs .onrender.com só são conhecidas depois que os serviços existem.

services:
  - type: web
    name: agora-api
    runtime: node
    plan: free
    region: virginia
    rootDir: api
    # Sem NODE_ENV no build: o npm ci pularia as devDependencies e o nest build falharia.
    buildCommand: npm ci && npm run build
    # As migrations rodam no boot da API (migrationsRun, D-031).
    startCommand: node dist/main
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agora-db
          property: connectionString
      - key: DB_SSL
        value: "false"
      - key: WEB_ORIGIN
        sync: false

  - type: web
    name: agora-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # Sem o rewrite, abrir um link direto (ex.: comprovante) dá 404.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Embutida no bundle no build: mudar o valor exige novo deploy do front.
      - key: VITE_API_URL
        sync: false

databases:
  - name: agora-db
    plan: free
    region: virginia
    postgresMajorVersion: "17"
    databaseName: agora
    user: agora
